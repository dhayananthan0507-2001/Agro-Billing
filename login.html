<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Agro POS</title><link rel="stylesheet" href="assets/css/auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<div class="side"><h1>Agro POS</h1><p>Fast billing, accurate stock and clear accounts for your seed, fertilizer and farm-supply shop.</p></div>
<main><form id="loginForm" novalidate><h2>Sign in</h2><div id="msg"></div>
<label for="email">Email</label><input id="email" type="email" autocomplete="username">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<div class="row"><label><input id="remember" type="checkbox" checked>Remember me</label><a href="#" id="forgot">Forgot password?</a></div>
<button id="btn" data-label="Sign in">Sign in</button><p class="alt">New shop? <a href="register.html">Create an account</a></p></form></main><script src="assets/js/auth.js"></script></body></html>
